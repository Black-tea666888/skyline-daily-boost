<style>
  :root {
    --ink: #fff;
    --muted: rgba(255,255,255,.72);
    --glass: rgba(10,14,32,.42);
    --line: rgba(255,255,255,.16);
    --accent: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; overflow-x: hidden; color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    background: #0b1026;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Scene ---------- */
  .scene { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .sky { position: absolute; inset: 0; transition: background 1.2s ease; }
  .stars { position: absolute; inset: 0; transition: opacity 1.2s ease; }
  .stars circle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .orb {
    position: absolute; width: 90px; height: 90px; border-radius: 50%;
    top: 12vh; right: 12vw; transition: all 1.2s ease; filter: blur(.3px);
  }
  .layer { position: absolute; left: -4%; right: -4%; bottom: 0; transition: transform .25s ease-out; }
  .layer svg { width: 100%; height: 100%; display: block; }
  .l1 { height: 52vh; } .l2 { height: 42vh; } .l3 { height: 32vh; }
  .win { animation: flicker 6s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { opacity: .95 } 45% { opacity: .95 } 50% { opacity: .2 } 55% { opacity: .95 } }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 6vh; background: linear-gradient(to top, rgba(0,0,0,.55), transparent); }

  /* ---------- Layout ---------- */
  .wrap {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px 40px; gap: 14px;
  }
  .card {
    width: min(620px, 100%); padding: clamp(20px, 4.5vw, 34px); border-radius: 26px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(130%); -webkit-backdrop-filter: blur(14px) saturate(130%);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools .chip { white-space: nowrap; }
  .brand h1 { margin: 0; font-size: clamp(1.1rem, 2.8vw, 1.35rem); letter-spacing: .02em; }
  .streak {
    font-size: .78rem; padding: 3px 10px; border-radius: 999px;
    background: rgba(255,210,122,.16); color: var(--accent); white-space: nowrap;
  }
  #langBtn, #noiseBtn, #notifyBtn { white-space: nowrap; }
  .colink { display: inline-block; margin-top: 8px; font-size: .85rem; color: inherit; opacity: .85; text-decoration: underline; text-underline-offset: 3px; }
  .colink:hover { opacity: 1; }
  #vol { flex: 1 1 100%; width: 100%; order: 3; }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4);
    background: transparent; font-size: .82rem; cursor: pointer; transition: background .2s;
  }
  .chip:hover, .chip[aria-pressed="true"] { background: rgba(255,255,255,.16); }

  .mode { display: flex; gap: 6px; margin-top: 16px; }
  .mode .chip { border-color: transparent; background: rgba(255,255,255,.08); }
  .mode .chip[aria-pressed="true"] { background: #fff; color: #1a1f36; }

  .content { margin-top: 20px; }
  .cityrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .eyebrow { margin: 0 0 4px; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .city { margin: 0; font-size: clamp(1.5rem, 4.4vw, 2rem); font-weight: 700; }
  .clock { text-align: right; }
  .clock .t { font-size: 1.15rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  .clock .p { font-size: .78rem; color: var(--muted); }
  .geo { margin: 10px 0 0; line-height: 1.7; color: rgba(255,255,255,.92); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: .74rem; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.1); }

  .quote {
    margin: 22px 0 0; padding: 22px 14px 16px; text-align: center;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .quote blockquote { margin: 0; font-size: clamp(1.1rem, 3.2vw, 1.4rem); line-height: 1.6; font-weight: 500; }
  .qactions { display: flex; justify-content: center; gap: 4px; margin-top: 12px; }
  .icon {
    border: none; background: none; padding: 6px 10px; border-radius: 10px;
    font-size: .82rem; color: var(--muted); cursor: pointer;
  }
  .icon:hover { color: #fff; background: rgba(255,255,255,.08); }
  .icon[aria-pressed="true"] { color: var(--accent); }

  .company {
    margin-top: 18px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start;
    background: rgba(255,255,255,.07); border-radius: 16px; padding: 14px 16px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-weight: 800; font-size: 1.05rem; color: #fff;
  }
  .company h2 { margin: 0; font-size: 1.02rem; }
  .company .meta { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .company p { margin: 6px 0 0; line-height: 1.6; font-size: .93rem; }
  .company .tip { margin-top: 8px; font-size: .86rem; color: var(--accent); }

  .nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; }
  .btn {
    padding: 12px 28px; border: none; border-radius: 14px; cursor: pointer;
    background: #fff; color: #1a1f36; font-weight: 700; font-size: 1rem;
    box-shadow: 0 8px 22px rgba(0,0,0,.25); transition: transform .15s;
  }
  .btn:hover { transform: translateY(-1px); } .btn:active { transform: translateY(1px); }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.06); cursor: pointer; font-size: 1.1rem;
  }
  .round:disabled { opacity: .3; cursor: default; }

  .hint { font-size: .74rem; color: var(--muted); text-align: center; }
  kbd { font-family: inherit; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); font-size: .7rem; }

  /* ---------- Favorites panel ---------- */
  .panel {
    width: min(620px, 100%); padding: 18px 22px; border-radius: 20px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .panel h3 { margin: 0 0 10px; font-size: .95rem; }
  .panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .panel li { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .92rem; line-height: 1.5; }
  .panel .empty { color: var(--muted); font-size: .88rem; }
  [hidden] { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    padding: 9px 16px; border-radius: 999px; background: rgba(0,0,0,.75); font-size: .88rem;
    transition: all .25s ease; z-index: 5; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fade { animation: fadeUp .55s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  /* ---------- Weather & sky effects ---------- */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .drop { position: absolute; top: -10vh; width: 1px; height: 14vh; background: linear-gradient(transparent, rgba(200,220,255,.55)); animation: rain linear infinite; }
  @keyframes rain { to { transform: translate(-6vw, 125vh); } }
  .flake { position: absolute; top: -5vh; border-radius: 50%; background: #fff; opacity: .85; animation: snow linear infinite; }
  @keyframes snow { to { transform: translate(4vw, 110vh); } }
  .fog { position: absolute; left: -50%; width: 200%; height: 30vh; background: radial-gradient(ellipse at center, rgba(255,255,255,.22), transparent 65%); animation: fogMove 40s linear infinite; }
  @keyframes fogMove { from { transform: translateX(-10%); } to { transform: translateX(10%); } }
  .neon { position: absolute; left: 0; right: 0; bottom: 0; height: 45vh; background: radial-gradient(ellipse at 50% 100%, rgba(255,60,200,.35), transparent 60%), radial-gradient(ellipse at 20% 100%, rgba(60,220,255,.25), transparent 50%); animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .shoot { position: absolute; width: 120px; height: 2px; background: linear-gradient(90deg, #fff, transparent); opacity: 0; transform: rotate(-20deg); }
  .shoot.go { animation: shoot 1.1s ease-out forwards; }
  @keyframes shoot { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; translate: -340px 130px; } }

  /* ---------- Info strip ---------- */
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .pick {
    margin-left: 8px; padding: 2px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08); color: #fff; font: inherit; font-size: .72rem; letter-spacing: 0; text-transform: none;
    color-scheme: dark; max-width: 150px;
  }
  .conv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: .86rem; }
  .conv label { color: var(--muted); }
  .conv input { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font: inherit; color-scheme: dark; }
  .conv b { font-variant-numeric: tabular-nums; }
  .conv .chip { margin-left: auto; }
  #vol { width: 110px; accent-color: var(--accent); }
  #sndPick .chip { font-size: .78rem; padding: 4px 10px; }
  #sndPick .chip[aria-pressed="true"] { background: #fff; color: #1a1f36; }
  .modal .box.wbox, .modal .box.ebox { text-align: left; }
  .modal .box.wbox { width: min(760px, 100%); }
  .modal .box.ebox { width: min(560px, 100%); }
  .wdetail { min-width: 0; }
  .wbox { width: min(760px, 100%); max-height: 88vh; overflow-y: auto; text-align: left; padding: 20px; }
  .wgrid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  .wplaces { display: grid; gap: 4px; align-content: start; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .wplaces h4 { margin: 8px 0 2px; font-size: .72rem; letter-spacing: .1em; color: var(--muted); }
  .wplace { text-align: left; padding: 7px 10px; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-size: .9rem; display: flex; justify-content: space-between; gap: 8px; }
  .wplace:hover { background: rgba(255,255,255,.08); }
  .wplace[aria-current="true"] { background: rgba(255,255,255,.16); font-weight: 600; }
  .wplace small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .wdetail h2 { margin: 0; font-size: 1.5rem; }
  .wstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .wnews { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .wnews a {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,255,255,.07); color: #fff; text-decoration: none; font-size: .92rem;
  }
  .wnews a:hover { background: rgba(255,255,255,.14); }
  .wnews small { color: var(--muted); }
  @media (max-width: 600px) {
    .wgrid { grid-template-columns: 1fr; }
    .wplaces { max-height: 30vh; }
    .wstats { grid-template-columns: 1fr 1fr 1fr; }
  }
  .fact { background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 10px; }
  .fact .k { font-size: .7rem; color: var(--muted); }
  .fact .v { font-size: .92rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* ---------- Tools panel ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs .chip { border-color: transparent; background: rgba(255,255,255,.08); }
  .tabs .chip[aria-selected="true"] { background: #fff; color: #1a1f36; }
  .timer { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tctl { display: flex; flex-direction: column; gap: 8px; }
  .presets { display: flex; gap: 6px; }
  .tmsg { font-size: .85rem; color: var(--muted); }
  .goals { display: grid; gap: 8px; }
  .goal { display: flex; align-items: center; gap: 10px; }
  .goal input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .goal input[type=text] {
    flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: .92rem;
  }
  .goal input[type=text]::placeholder { color: rgba(255,255,255,.45); }
  .goal.done input[type=text] { text-decoration: line-through; opacity: .6; }
  .progress { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 4px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  .confetti { position: absolute; top: -10px; width: 8px; height: 12px; animation: fall 2.2s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .4; } }

  .bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 6px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: rgba(255,255,255,.18); min-height: 4px; transition: height .5s ease; }
  .bar.today i { background: var(--accent); }
  .bar span { font-size: .7rem; color: var(--muted); }
  .bar b { font-size: .7rem; font-weight: 600; }
  .stats-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addrow input {
    flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: .92rem;
  }
  .mylist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .mylist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .92rem; }
  .modal { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(0,0,0,.6); padding: 20px; }
  .modal .box { background: #141a33; border: 1px solid var(--line); border-radius: 20px; padding: 16px; width: min(420px, 100%); text-align: center; }
  .modal img { width: 100%; border-radius: 12px; display: block; }
  .modal .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .modal p { font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
  .tabs { flex-wrap: wrap; }
  .ebox { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; text-align: left; padding: 20px; }
  .ehead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ehead h3 { margin: 0; font-size: 1.05rem; }
  .favbox { max-height: min(80vh, 640px); display: flex; flex-direction: column; }
  .favsub { font-size: .8rem; opacity: .7; margin-top: 2px; }
  .favlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 10px; }
  .favlist li { border-left: 3px solid #ffc46b; background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px 14px; }
  body.light .favlist li { background: rgba(0,0,0,.04); }
  .favlist .fq { font-size: 1rem; line-height: 1.5; }
  .favlist .fa { display: flex; gap: 6px; margin-top: 8px; }
  .favlist .fa .chip { padding: 4px 10px; font-size: .78rem; }
  .favlist .empty { border: 0; background: none; text-align: center; padding: 28px 10px; opacity: .8; }
  .favlist .empty b { display: block; font-size: 2.2rem; margin-bottom: 6px; color: #ffc46b; }
  .eform { display: grid; gap: 10px; }
  .eform label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); text-align: left; min-width: 0; }
  .eform input, .eform select, .eform textarea { width: 100%; min-width: 0; box-sizing: border-box; }
  .eform input[type=range] { padding: 0; }
  .eform input[type=color] { height: 40px; padding: 4px; }
  .eform input, .eform select, .eform textarea {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: .92rem; color-scheme: dark;
  }
  .eform textarea { min-height: 64px; resize: vertical; }
  .eform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .eform .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .elist li { background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 10px; }
  .elist .t { overflow: hidden; text-overflow: ellipsis; }
  .eio { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .eio label { cursor: pointer; }
  @media (max-width: 480px) { .eform .two { grid-template-columns: 1fr; } }
  .word { background: rgba(255,255,255,.07); border-radius: 16px; padding: 14px 16px; }
  .wordtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .word .w { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; }
  .word .pos { font-size: .85rem; color: var(--muted); font-style: italic; }
  .wzh { margin-top: 2px; font-weight: 600; color: var(--accent); }
  .wex { margin-top: 10px; line-height: 1.55; }
  .wexzh { font-size: .86rem; color: var(--muted); margin-top: 2px; }
  .quiz { margin-top: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filters .chip { font-size: .78rem; padding: 4px 10px; border-color: transparent; background: rgba(255,255,255,.08); }
  .filters .chip[aria-pressed="true"] { background: #fff; color: #1a1f36; }
  .rrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .rrow input {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: .92rem; color-scheme: dark;
  }
  #rText { flex: 1; min-width: 160px; }
  .days { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .day { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; font-size: .82rem; }
  .day[aria-pressed="true"] { background: var(--accent); color: #1a1f36; border-color: var(--accent); font-weight: 700; }
  .rlist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .rlist li { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "time text act"; gap: 4px 12px; align-items: center; background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 12px; }
  .rlist .rt { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rlist .rd { font-size: .74rem; color: var(--muted); }
  .rlist li > div:first-child { grid-area: time; } .rlist .rx { grid-area: text; } .rlist .ract { grid-area: act; }
  @media (max-width: 520px) {
    .rlist li { grid-template-columns: auto 1fr; grid-template-areas: "time act" "text text"; }
    .rlist .ract { justify-content: flex-end; }
  }
  .rlist .rx { font-size: .9rem; line-height: 1.4; word-break: break-word; }
  .rlist li.off { opacity: .45; }
  .ract { display: flex; gap: 2px; align-items: center; }
  .switch { width: 40px; height: 24px; border-radius: 99px; border: none; background: rgba(255,255,255,.2); position: relative; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }

<body>

<div class="scene" aria-hidden="true">

</div>

<div class="wrap">

        <div class="fact"><div class="k" id="kWx"></div><div class="v" id="vWx"></div></div>

function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
}
function todayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

let pin = store.get("sdb.pin", null); // pinned city index, or null for random
const pinned = () => (typeof pin === "number" && pin >= 0 && pin < cities.length) ? pin : null;
function dailyState() {
  const r = rng(hash(todayKey()));
  const s = { city: Math.floor(r() * cities.length), quote: Math.floor(r() * quotes.length), company: Math.floor(r() * companies.length) };
  if (pinned() !== null) s.city = pinned();
  return s;
}
function randomState(prev) {
  const pick = (n, avoid) => { let i; do { i = Math.floor(Math.random() * n); } while (n > 1 && i === avoid); return i; };
  return { city: pinned() !== null ? pinned() : pick(cities.length, prev && prev.city), quote: pick(allLen(), prev && prev.quote), company: pick(companies.length, prev && prev.company) };
}

function localHour(tz) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
  const h = +parts.find(p => p.type === "hour").value % 24;
  const m = +parts.find(p => p.type === "minute").value;
  return h + m / 60;
}
function periodOf(h) { return h < 5 || h >= 20 ? "night" : h < 7.5 ? "dawn" : h < 17 ? "day" : "dusk"; }

/* ================= Scene ================= */
function buildStars() {
  const r = rng(424242);
  let s = "";
  for (let i = 0; i < 110; i++) {
    const x = (r() * 100).toFixed(2), y = (r() * 62).toFixed(2), rad = (r() * 1.3 + .3).toFixed(2);
    s += `<circle cx="${x}%" cy="${y}%" r="${rad}" fill="#fff" style="animation-delay:${(r() * 3).toFixed(2)}s"/>`;
  }
  $("stars").innerHTML = s;
}

function terrainPath(r, kind, W, H) {
  if (kind === "flat") return "";
  const amp = kind === "mountains" ? H * .55 : H * .22;
  const steps = kind === "mountains" ? 7 : 5;
  let d = `M0 ${H} `;
  for (let i = 0; i <= steps; i++) {
    const x = (W / steps) * i;
    const y = H - amp * (kind === "mountains" ? (.45 + r() * .55) : (.5 + .5 * Math.sin(i + r())));
    d += kind === "mountains" ? `L${x.toFixed(0)} ${y.toFixed(0)} ` : `Q${(x - W / steps / 2).toFixed(0)} ${(y - 30).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)} `;
  }
  return d + `L${W} ${H} Z`;
}

/* ---------- City landmarks (simple silhouettes, layer coords 1400 x 400) ---------- */
function palms(color, xs) {
  return xs.map(([x, h, lean]) => {
    const top = 400 - h, tx = x + lean;
    const fronds = [[-60, 18], [-42, -10], [-12, -22], [20, -20], [48, -6], [62, 20]]
      .map(([dx, dy]) => `<path d="M${tx} ${top} q${dx / 2} ${dy - 14} ${dx} ${dy}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`).join("");
    return `<path d="M${x} 400 Q${x + lean * .2} ${400 - h / 2} ${tx} ${top}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"/>${fronds}`;
  }).join("");
}

};
const CITY_LANDMARK = ["empire", "goldengate", "willis", "needle", "palms", "", "tower", "palms", "capitol", "", "", "palms"];

function buildLayer(cfg, depth, color, period) {
  const lm = LANDMARKS[CITY_LANDMARK[cities.findIndex(c => c.sky === cfg)]];
  const r = rng(cfg.seed * 7 + depth * 131);
  const W = 1400, H = 400;
  const count = Math.round(cfg.n * (depth === 0 ? .8 : depth === 1 ? 1 : .7));
  const maxH = H * cfg.h * (depth === 0 ? .95 : depth === 1 ? .75 : .5);
  let shapes = "", windows = "";
  const lit = period === "night" || period === "dusk";

  if (depth === 0 && cfg.terrain !== "flat") {
    shapes += `<path d="${terrainPath(r, cfg.terrain, W, H)}" opacity=".7"/>`;
    if (cfg.terrain === "mountains" && period !== "day") shapes += "";
  }

  let x = -10;
  const slot = W / count;
  for (let i = 0; i < count; i++) {
    const w = slot * (.55 + r() * .4);
    let hh = maxH * (.3 + r() * .7);
    if (cfg.terrain === "hills") hh *= .55 + .45 * Math.sin((i / count) * Math.PI);
    hh = Math.max(24, hh);
    const y = H - hh;
    if (lm && depth >= 1 && x + w > lm.clear[0] && x < lm.clear[1]) { x += slot; continue; } // keep the landmark visible
    shapes += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}"/>`;
    // occasional stepped top or spire on the tallest
    if (r() > .7) shapes += `<rect x="${(x + w * .2).toFixed(1)}" y="${(y - hh * .08).toFixed(1)}" width="${(w * .6).toFixed(1)}" height="${(hh * .08 + 1).toFixed(1)}"/>`;
    if (cfg.spire && depth === 1 && hh > maxH * .85) shapes += `<rect x="${(x + w / 2 - 1.5).toFixed(1)}" y="${(y - 40).toFixed(1)}" width="3" height="40"/>`;

    // lit windows on the front two layers
    if (lit && depth >= 1) {
      const cols = Math.max(1, Math.floor(w / 12)), rows = Math.floor(hh / 16);
      for (let cx = 0; cx < cols; cx++) for (let ry = 1; ry < rows; ry++) {
        if (r() < (depth === 2 ? .16 : .1)) {
          const delay = (r() * 12).toFixed(1);
          windows += `<rect class="win" x="${(x + 4 + cx * 12).toFixed(1)}" y="${(y + ry * 16).toFixed(1)}" width="5" height="7" style="animation-delay:${delay}s;animation-duration:${(6 + r() * 8).toFixed(1)}s"/>`;
        }
      }
    }
    x += slot;
  }
  if (lm && depth === 1) shapes += lm.svg(color);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">
    <g fill="${color}">${shapes}</g>
    <g fill="#ffd98a" opacity=".9">${windows}</g>
  </svg>`;
}

function paintScene(state) {
  const c = cities[state.city];
  const p = periodOf(localHour(c.tz));
  const s = SKIES[p];
  $("sky").style.background = s.sky;
  $("stars").style.opacity = s.stars;
  const orb = $("orb");
  orb.style.background = s.orb;
  orb.style.boxShadow = s.glow;
  orb.style.top = p === "day" ? "9vh" : p === "night" ? "11vh" : "26vh";
  ["l1", "l2", "l3"].forEach((id, i) => { $(id).innerHTML = buildLayer(c.sky, i, s.bld[i], p); });
  document.querySelector('meta[name="theme-color"]').content = s.theme;
  setWeather(state.city, p);
  return p;
}

/* weather overlays */
function setWeather(ci, period) {
  const w = $("weather");
  let kind = GEO[ci][2];
  const real = wxFor(GEO[ci]);
  if (real) kind = wxInfo(real.code, real.isDay).fx || (kind === "neon" ? "neon" : ""); // real weather wins
  const month = new Date().getMonth();
  if (kind === "snowWinter") kind = (month === 11 || month <= 1) ? "snow" : "";
  if (kind === "neon" && period === "day") kind = "";
  if (reduceMotion) kind = kind === "neon" || kind === "fog" ? kind : "";
  let html = "";
  const r = Math.random;
  if (kind === "rain") for (let i = 0; i < 70; i++)
    html += `<i class="drop" style="left:${(r() * 110).toFixed(1)}%;animation-duration:${(.6 + r() * .5).toFixed(2)}s;animation-delay:${(-r() * 2).toFixed(2)}s"></i>`;
  if (kind === "snow") for (let i = 0; i < 60; i++) {
    const s = (2 + r() * 4).toFixed(1);
    html += `<i class="flake" style="left:${(r() * 100).toFixed(1)}%;width:${s}px;height:${s}px;animation-duration:${(7 + r() * 8).toFixed(1)}s;animation-delay:${(-r() * 15).toFixed(1)}s"></i>`;
  }
  if (kind === "fog") html = `<i class="fog" style="bottom:12vh"></i><i class="fog" style="bottom:2vh;animation-duration:55s;animation-direction:reverse"></i>`;
  if (kind === "neon") html = `<i class="neon"></i>`;
  w.innerHTML = html;
  scene.period = period;
}
const scene = { period: "day" };

/* shooting stars at night */
function shootingStar() {
  if (!reduceMotion && scene.period === "night" && !document.hidden) {
    const s = document.createElement("i");
    s.className = "shoot";
    s.style.left = (40 + Math.random() * 55) + "%";
    s.style.top = (4 + Math.random() * 30) + "%";
    $("shootLayer").appendChild(s);
    requestAnimationFrame(() => s.classList.add("go"));
    setTimeout(() => s.remove(), 1400);
  }
  setTimeout(shootingStar, 6000 + Math.random() * 9000);
}

/* distance & time difference */
function haversine(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function tzOffsetHours(tz) {
  const now = new Date();
  const asTz = new Date(now.toLocaleString("en-US", { timeZone: tz }));
  const asMe = new Date(now.toLocaleString("en-US"));
  return Math.round((asTz - asMe) / 1800000) / 2;
}

/* parallax */
if (!reduceMotion) {
  window.addEventListener("pointermove", e => {
    const dx = (e.clientX / innerWidth - .5);
    $("l1").style.transform = `translateX(${dx * -8}px)`;
    $("l2").style.transform = `translateX(${dx * -16}px)`;
    $("l3").style.transform = `translateX(${dx * -26}px)`;
  });
}

/* ================= Render ================= */
function current() { return history[hIndex]; }

function tickClock() {
  const st = current(); if (!st) return;
  const c = cities[st.city];
  const fmt = new Intl.DateTimeFormat(lang === "zh" ? "zh-TW" : "en-US", { timeZone: c.tz, hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: hc() });
  $("clock").textContent = fmt.format(new Date());
  $("period").textContent = `${UI[lang].local} · ${UI[lang].period[periodOf(localHour(c.tz))]}`;
}

function render(animate) {
  const ui = UI[lang], st = current();
  const c = cities[st.city][lang], q = Q(st.quote), co = companies[st.company], cl = co[lang];

  document.documentElement.lang = lang === "zh" ? "zh-TW" : "en";
  document.title = ui.title;
  $("heading").textContent = ui.heading;
  $("langBtn").textContent = ui.lang;
  $("editBtn").textContent = ui.edit; $("setBtn").textContent = ui.set;
  drawEditor(); drawWorld(); drawSettings(); drawZen(); drawReview();
  if (window.sdbSyncLabel) window.sdbSyncLabel();
  if (window.sdbDrawAccount) window.sdbDrawAccount();
  $("btn").textContent = ui.btn;
  $("eyebrow").textContent = ui.eyebrow;
  $("modeDaily").textContent = ui.daily;
  $("modeRandom").textContent = ui.random;
  $("modeDaily").setAttribute("aria-pressed", mode === "daily");
  $("modeRandom").setAttribute("aria-pressed", mode === "random");

  $("city").textContent = c.name;
  $("geo").textContent = c.geo;
  $("tags").innerHTML = (c.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");

  $("quote").textContent = q[lang];
  const isFav = favs.includes(q.id);
  $("favBtn").textContent = isFav ? ui.faved : ui.fav;
  $("favBtn").setAttribute("aria-pressed", isFav);
  $("copyBtn").textContent = ui.copy;
  $("shareBtn").textContent = ui.share;

  $("logo").textContent = co.mark;
  $("logo").style.background = co.color;
  $("companyName").textContent = cl.name;
  $("companyMeta").textContent = `${ui.founded} ${co.founded} · ${ui.hq} ${cl.hq}`;
  $("companyInfo").textContent = cl.info;
  $("companyTip").textContent = ui.tipLabel + cl.tip;
  const coUrl = /^https:\/\//.test(co.url || "") ? co.url : CO_URL[co.id];
  $("companyLink").hidden = !coUrl;
  if (coUrl) { $("companyLink").href = coUrl; $("companyLink").textContent = (lang === "zh" ? "前往 " : "Visit ") + coUrl.replace(/^https:\/\/(www\.)?/, ""); }

  $("prevBtn").disabled = hIndex <= 0;
  $("nextBtn").disabled = hIndex >= history.length - 1;
  $("prevBtn").setAttribute("aria-label", lang === "zh" ? "上一組" : "Previous");
  $("nextBtn").setAttribute("aria-label", lang === "zh" ? "下一組" : "Next");

  const g = GEO[st.city], off = tzOffsetHours(cities[st.city].tz);
  const hi = homeCity(), hg = hi !== null ? GEO[hi] : null;
  const km = g && typeof g[0] === "number" && hg ? haversine(hg, g) : 0;
  $("kDiff").textContent = ui.diff;
  $("vDiff").textContent = off === 0 ? ui.same : `${off > 0 ? "+" : ""}${off} ${ui.hrs}`;
  $("kDist").textContent = hi !== null ? ui.dist(cities[hi][lang].name) : ui.distNone;
  const hasGeo = !!hg && g && typeof g[0] === "number" && typeof g[1] === "number";
  $("vDist").textContent = hasGeo ? `${Math.round(km).toLocaleString()} km` : "—";
  $("kFlight").textContent = ui.flight;
  $("vFlight").textContent = hasGeo && km > 150 ? `${Math.round(km / 850 + .5)} ${ui.hrs}` : "—";
  $("kWx").textContent = ui.wx;
  showWeather(st.city);
  $("convL").textContent = ui.conv; $("newsBtn").textContent = ui.news;
  drawConv(); drawPicker();
  renderTools();

  $("favToggle").textContent = `${ui.favs}${favs.length ? " " + favs.length : ""}`;
  $("streak").textContent = ui.streak(streak);
  $("hint").innerHTML = ui.hint;
  renderFavs();
  tickClock();

  if (animate && !reduceMotion) {
    const el = $("content");
    el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  }
}

function renderFavs() {
  const ui = UI[lang];
  const list = favs.map(id => qById(id)).filter(Boolean).reverse();
  $("panelTitle").textContent = ui.panel;
  $("favSub").textContent = list.length ? ui.favSub(list.length) : "";
  $("favClose").textContent = ui.close;
  $("favList").innerHTML = list.length
    ? list.map(q => `<li><div class="fq">“${esc(q[lang])}”</div><div class="fa"><button class="chip" data-cp="${q.id}" type="button">${ui.copy}</button><button class="chip" data-rm="${q.id}" type="button">${ui.remove}</button></div></li>`).join("")
    : `<li class="empty">${ui.empty}</li>`;
}

function go(state, push = true) {
  if (push) { history = history.slice(0, hIndex + 1); history.push(state); hIndex = history.length - 1; }
  paintScene(state);
  render(true);
}

/* ================= Streak ================= */
let streak = 1;
(function updateStreak() {
  const today = todayKey();
  const last = store.get("sdb.last", null);
  streak = store.get("sdb.streak", 0);
  if (last !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    streak = last === todayKey(y) ? streak + 1 : 1;
    store.set("sdb.last", today); store.set("sdb.streak", streak);
  }
  streak = Math.max(1, streak);
})();

/* ================= Actions ================= */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

function newSet() { mode = "random"; store.set("sdb.mode", mode); go(randomState(current())); }
function prev() { if (hIndex > 0) { hIndex--; go(current(), false); } }
function next() { if (hIndex < history.length - 1) { hIndex++; go(current(), false); } }
function toggleLang() { lang = lang === "zh" ? "en" : "zh"; store.set("sdb.lang", lang); render(false); }
function toggleFav() {
  const i = Q(current().quote).id, ui = UI[lang];
  if (favs.includes(i)) { favs = favs.filter(x => x !== i); toast(ui.favRemoved); }
  else { favs.push(i); toast(ui.favAdded); }
  store.set("sdb.favs", favs); render(false);
}
function copyQuote() {
  const text = Q(current().quote)[lang];
  const ok = () => toast(UI[lang].copied);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  } else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); ok(); } catch (e) {} ta.remove();
  }
}

$("btn").onclick = newSet;
$("prevBtn").onclick = prev;
$("nextBtn").onclick = next;
$("langBtn").onclick = toggleLang;
$("favBtn").onclick = toggleFav;
$("copyBtn").onclick = copyQuote;
$("modeDaily").onclick = () => { mode = "daily"; store.set("sdb.mode", mode); go(dailyState()); };
$("modeRandom").onclick = newSet;
$("favToggle").onclick = () => { renderFavs(); $("favs").hidden = false; };
$("favClose").onclick = () => { $("favs").hidden = true; };
$("favs").onclick = e => { if (e.target.id === "favs") $("favs").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("favs").hidden = true; });
$("favList").onclick = e => {
  const cp = e.target.closest("[data-cp]");
  if (cp) { const q = qById(cp.dataset.cp); if (q) navigator.clipboard?.writeText(q[lang]).then(() => { cp.textContent = UI[lang].copiedShort; setTimeout(() => renderFavs(), 900); }); return; }
  const rm = e.target.closest("[data-rm]"); if (!rm) return;
  favs = favs.filter(x => x !== rm.dataset.rm); store.set("sdb.favs", favs); render(false);
};

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  const onBtn = e.target.tagName === "BUTTON";
  if ((e.code === "Space" || e.key === "Enter") && !onBtn) { e.preventDefault(); newSet(); }
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowRight") next();

// ---- endless practice: freshly generated questions (numbers + calculus) ----
const qgSUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
const qgSup = n => String(n).split("").map(c => qgSUP[c] || c).join("");
const qgTerm = (c, k) => k === 0 ? String(c) : (c === 1 ? "" : String(c)) + "x" + (k === 1 ? "" : qgSup(k));
function qgMake(subj, text, correct, wrongs, exp) {
  const uniq = [...new Set(wrongs.map(String))].filter(w => w !== String(correct));
  if (uniq.length < 3) return null;
  const opts = uniq.slice(0, 3);
  const idx = Math.floor(Math.random() * 4);
  opts.splice(idx, 0, String(correct));
  return [subj, text, opts, idx, exp];
}
const qgList = [
  () => { const n = 2 + Math.floor(Math.random() * 254), b = n.toString(2);
    const parts = [...b].map((d, i) => d === "1" ? 2 ** (b.length - 1 - i) : null).filter(x => x !== null);
    return qgMake("num", `What is ${n} in decimal, written in binary?`, b,
      [(n + 1).toString(2), (n - 1).toString(2), (n ^ (1 << Math.floor(Math.random() * 7))).toString(2), (n + 2).toString(2)],
      `${parts.join(" + ")} = ${n}, so the binary form is ${b}.`); },
  () => { const n = 10 + Math.floor(Math.random() * 246), h = n.toString(16).toUpperCase();
    return qgMake("num", `What is decimal ${n} in hexadecimal?`, h,
      [(n + 1).toString(16).toUpperCase(), (n - 1).toString(16).toUpperCase(), (n + 16).toString(16).toUpperCase(), (n ^ 1).toString(16).toUpperCase()],
      `${n} = ${Math.floor(n / 16)} × 16 + ${n % 16}, which is ${h} in hexadecimal.`); },
  () => { const N = [1, 2, 4, 8, 16, 32][Math.floor(Math.random() * 6)], w = N > 1 ? "s" : "";
    return qgMake("num", `How many bits are in ${N} byte${w}?`, String(8 * N),
      [String(N), String(4 * N), String(16 * N), String(8 * N + 8)],
      `1 byte = 8 bits, so ${N} byte${w} = ${8 * N} bits.`); },
  () => { const k = 2 + Math.floor(Math.random() * 9);
    return qgMake("num", `What is the largest value an unsigned ${k}-bit integer can hold?`, String(2 ** k - 1),
      [String(2 ** k), String(2 ** (k - 1) - 1), String(2 * k - 1), String(2 ** (k + 1) - 1)],
      `The largest unsigned ${k}-bit value is 2^${k} − 1 = ${2 ** k - 1}.`); },
  () => { const n = 2 + Math.floor(Math.random() * 8), c = qgTerm(n, n - 1);
    return qgMake("calc", `d/dx (${qgTerm(1, n)}) = ?`, c,
      [qgTerm(n - 1, n - 1), qgTerm(n, n), qgTerm(1, n - 1), qgTerm(n, n + 1)],
      `Power rule: d/dx xⁿ = n·xⁿ⁻¹, so the answer is ${c}.`); },
  () => { const n = 1 + Math.floor(Math.random() * 4), k = 1 + Math.floor(Math.random() * 5), c = (n + 1) * k, ans = qgTerm(k, n + 1) + " + C";
    return qgMake("calc", `∫ ${qgTerm(c, n)} dx = ?`, ans,
      [qgTerm(c, n + 1) + " + C", qgTerm(k, n) + " + C", qgTerm(k, n + 1), qgTerm(k + 1, n + 1) + " + C"],
      `Integrate term by term: ∫ xⁿ dx = xⁿ⁺¹/(n+1) + C, so the answer is ${ans}.`); },
];
function genEndless() {
  for (let t = 0; t < 60; t++) {
    const q = qgList[Math.floor(Math.random() * qgList.length)]();
    if (q) return q;
  }
  return null;
}
const TECH = ["cs", "num", "logic", "arch", "ds", "net", "db", "prog"];

let wordLv = store.get("sdb.words", {});
let wrongs = store.get("sdb.wrong", []);
function pickWord(avoid) {
  // weight unfamiliar words higher so they come back more often
  const weights = WORDS.map((w, i) => i === avoid ? 0 : 1 / (1 + 2 * (wordLv[w[0]] || 0)));
  let t = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i++) { t -= weights[i]; if (t <= 0) return i; }
  return 0;
}
function poolFor(filter) {
  if (filter === "wrong") return wrongs.filter(i => QUIZ[i]);
  return QUIZ.map((q, i) => i).filter(i => filter === "all" || (filter === "cs" ? TECH.includes(QUIZ[i][0]) : QUIZ[i][0] === filter));

function daysLabel(days) {
  const ui = UI[lang], d = [...days].sort().join("");

  const name = i => lang === "zh" ? "週" + DAYS_ZH[i] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][i];
  if (sd.length >= 3 && sd.every((v, k) => k === 0 || v === sd[k - 1] + 1)) // a run like Mon–Sat
    return lang === "zh" ? `${name(sd[0])}至${name(sd[sd.length - 1])}` : `${name(sd[0])}–${name(sd[sd.length - 1])}`;

/* calendar file (.ics) with a weekly repeating event and an alarm */
function downloadICS(r) {
  const pad = n => String(n).padStart(2, "0");
  const icsEsc = t => t.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const [hh, mm] = r.time.split(":").map(Number);
  // first date that matches one of the chosen days, starting today
  const start = new Date(); start.setHours(hh, mm, 0, 0);
  for (let i = 0; i < 7 && !r.days.includes(start.getDay()); i++) start.setDate(start.getDate() + 1);
  const local = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const now = new Date(), stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const byday = r.days.map(i => ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][i]).join(",");
  const url = location.protocol.startsWith("http") ? location.href.split("#")[0] : "";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Skyline Daily Boost//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT", `UID:${r.id}@skyline-daily-boost`, `DTSTAMP:${stamp}`,
    `DTSTART:${local(start)}`, "DURATION:PT10M", `RRULE:FREQ=WEEKLY;BYDAY=${byday}`,
    `SUMMARY:${icsEsc(r.text)}`, `DESCRIPTION:${icsEsc(UI[lang].rTitle + (url ? "\n" + url : ""))}`,
    ...(url ? [`URL:${url}`] : []),
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(r.text)}`, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  a.download = `daily-boost-${r.time.replace(":", "")}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(UI[lang].rCalHint);
}

/* in-page scheduler: fires each reminder once per day, up to 60 min late */
function fireReminder(r) {
  const quote = Q(current().quote)[lang];
  const body = `${r.text}\n${quote}`;
  const title = UI[lang].rTitle;
  chime(); toast(r.text);
  showNote(title, body, "sdb-" + r.id);
}
function checkReminders() {
  const now = new Date(), today = todayKey(now), mins = now.getHours() * 60 + now.getMinutes();
  const fired = store.get("sdb.rFired", {});
  let changed = false;
  reminders.forEach(r => {
    if (!r.on || !r.days.includes(now.getDay()) || fired[r.id] === today) return;
    const [hh, mm] = r.time.split(":").map(Number), late = mins - (hh * 60 + mm);
    if (late >= 0 && late <= 60) { fireReminder(r); fired[r.id] = today; changed = true; }
  });
  if (changed) store.set("sdb.rFired", fired);
}
setInterval(checkReminders, 20000);

/* ================= Live weather (Open-Meteo, free, no key) ================= */
const wxCache = store.get("sdb.wx", {});
const wxKey = g => `${(+g[0]).toFixed(2)},${(+g[1]).toFixed(2)}`;
const validGeo = g => g && typeof g[0] === "number" && typeof g[1] === "number";
function wxFor(g) { if (!validGeo(g)) return null; const w = wxCache[wxKey(g)]; return w && Date.now() - w.at < 60 * 60 * 1000 ? w : null; }
function wxInfo(code, isDay) {
  const z = lang === "zh";
  if (code === 0) return { icon: isDay ? "" : "", text: z ? "晴" : "Clear", fx: "" };
  if (code <= 2) return { icon: isDay ? "" : "", text: z ? "晴時多雲" : "Partly cloudy", fx: "" };
  if (code === 3) return { icon: "", text: z ? "陰" : "Overcast", fx: "" };
  if (code === 45 || code === 48) return { icon: "", text: z ? "霧" : "Fog", fx: "fog" };
  if (code >= 51 && code <= 57) return { icon: "", text: z ? "毛毛雨" : "Drizzle", fx: "rain" };
  if (code >= 61 && code <= 67) return { icon: "", text: z ? "雨" : "Rain", fx: "rain" };
  if (code >= 71 && code <= 77) return { icon: "", text: z ? "雪" : "Snow", fx: "snow" };
  if (code >= 80 && code <= 82) return { icon: "", text: z ? "陣雨" : "Showers", fx: "rain" };
  if (code === 85 || code === 86) return { icon: "", text: z ? "陣雪" : "Snow showers", fx: "snow" };
  if (code >= 95) return { icon: "", text: z ? "雷雨" : "Thunderstorm", fx: "rain" };
  return { icon: "", text: "", fx: "" };
}
const wxPending = {};
function loadWeather(g) {
  if (!validGeo(g)) return Promise.resolve(null);
  const cached = wxFor(g); if (cached && Date.now() - cached.at < 30 * 60 * 1000) return Promise.resolve(cached);
  const k = wxKey(g);
  if (wxPending[k]) return wxPending[k];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${g[0]}&longitude=${g[1]}&current=temperature_2m,weather_code,is_day&timezone=auto`;
  return wxPending[k] = fetch(url).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
    const w = { t: j.current.temperature_2m, code: j.current.weather_code, isDay: !!j.current.is_day, at: Date.now() };
    wxCache[k] = w;
    const keys = Object.keys(wxCache); if (keys.length > 40) delete wxCache[keys[0]];
    store.set("sdb.wx", wxCache);
    return w;
  }).catch(() => null).finally(() => { delete wxPending[k]; });
}
const wxText = w => {
  if (!w) return UI[lang].wxNA;
  const i = wxInfo(w.code, w.isDay), f = useF();
  return `${Math.round(f ? w.t * 9 / 5 + 32 : w.t)}°${f ? "F" : "C"} ${i.text}`;
};
function showWeather(ci) {
  const g = GEO[ci];
  $("vWx").textContent = wxText(wxFor(g));
  loadWeather(g).then(w => {
    if (!w || current().city !== ci) return;
    $("vWx").textContent = wxText(w);
    setWeather(ci, periodOf(localHour(cities[ci].tz))); // switch on real rain / snow / fog
  });
}

/* ================= Leaderboard (needs cloud sync; sync.js fills window.sdbBoard) ================= */
function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return `${t.getUTCFullYear()}-W${String(Math.ceil(((t - y0) / 86400000 + 1) / 7)).padStart(2, "0")}`;
}
function weekMinutes() {
  const log = store.get("sdb.log", {}), other = window.sdbRemoteLogs || {};
  const now = new Date(), dow = (now.getDay() + 6) % 7; // Monday = 0
  let sum = 0;
  for (let i = 0; i <= dow; i++) {
    const d = new Date(); d.setDate(now.getDate() - i); const k = todayKey(d);
    sum += (log[k] || 0) + Object.values(other).reduce((a, l) => a + (l[k] || 0), 0);
  }
  return sum;
}

function applyCustom() {

  companies.length = BASE.companies; QUIZ.length = BASE.quiz; WORDS.length = BASE.words;

// keep every saved index valid after an item at `idx` is removed from `kind`
function shiftAfterDelete(kind, idx) {
  const fix = v => v > idx ? v - 1 : v === idx ? 0 : v;
  if (kind === "cities") {
    history.forEach(h => h.city = fix(h.city));
    if (typeof pin === "number") { pin = pin === idx ? null : pin > idx ? pin - 1 : pin; store.set("sdb.pin", pin); }
  }
  if (kind === "companies") history.forEach(h => h.company = fix(h.company));
  if (kind === "quiz") {
    wrongs = wrongs.filter(x => x !== idx).map(x => x > idx ? x - 1 : x); store.set("sdb.wrong", wrongs);
    learn.q = fix(learn.q); learn.picked = null;
  }

}
function clampAll() {

};
$("eList").onclick = e => {
  const ebtn = e.target.closest("[data-eedit]"), dbtn = e.target.closest("[data-edel]");
  if (ebtn) { ed.editing = ebtn.dataset.eedit; drawEditor(); $("eForm").scrollIntoView({ block: "nearest" }); }
  if (dbtn) {
    const items = itemsOf(ed.cat), pos = items.findIndex(x => x.id === dbtn.dataset.edel);
    if (pos < 0) return;
    if (ed.cat === "quotes") {
      const id = "c" + items[pos].id, curId = Q(current().quote).id;
      items.splice(pos, 1); store.set("sdb.myQuotes", myQuotes);
      favs = favs.filter(x => x !== id); store.set("sdb.favs", favs);
      if (curId === id) current().quote = 0;
    } else {
      shiftAfterDelete(ed.cat, BASE[ed.cat] + pos);
      items.splice(pos, 1);
    }
    if (ed.editing === dbtn.dataset.edel) ed.editing = null;
    toast(UI[lang].eDeleted); saveCustom();
  }
};

/* export / import a backup file that friends can share */
$("eExport").onclick = () => {
  const data = { app: "skyline-daily-boost", version: 1, exported: new Date().toISOString(), ...custom, quotes: myQuotes };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `daily-boost-custom-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(UI[lang].eExported);
};
$("eImport").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "skyline-daily-boost") throw 0;
    const str = (v, n) => String(v === undefined || v === null ? "" : v).slice(0, n);
    const clean = {
      cities: x => x.name && x.desc && { name: str(x.name, 30), desc: str(x.desc, 160), tags: str(x.tags, 80), tz: str(x.tz, 40), terrain: str(x.terrain, 10), lat: str(x.lat, 12), lon: str(x.lon, 12), height: str(x.height, 5) },
      companies: x => x.name && x.info && { name: str(x.name, 30), color: str(x.color, 7), founded: str(x.founded, 4), hq: str(x.hq, 40), info: str(x.info, 160), tip: str(x.tip, 100) },
      quiz: x => x.question && x.o0 && x.o1 && x.o2 && x.o3 && { subject: str(x.subject, 4), question: str(x.question, 200), o0: str(x.o0, 60), o1: str(x.o1, 60), o2: str(x.o2, 60), o3: str(x.o3, 60), answer: str(x.answer, 1), exp: str(x.exp, 200) },
      words: x => x.word && x.zh && { word: str(x.word, 30), pos: str(x.pos, 10), zh: str(x.zh, 40), ex: str(x.ex, 160), exZh: str(x.exZh, 160) },
      quotes: x => x.t && { t: str(x.t, 80) }
    };
    let n = 0;
    Object.keys(clean).forEach(cat => {
      const items = itemsOf(cat), have = new Set(items.map(x => x.id));
      (Array.isArray(data[cat]) ? data[cat] : []).forEach(x => {
        const c = x && typeof x === "object" && clean[cat](x);
        if (!c) return;
        const id = typeof x.id === "string" && /^[a-z0-9]{4,20}$/.test(x.id) ? x.id : Date.now().toString(36) + n;
        if (have.has(id)) return; // already imported
        items.push({ id, ...c }); have.add(id); n++;
      });
    });
    store.set("sdb.myQuotes", myQuotes);
    toast(UI[lang].eImported(n)); saveCustom();
  } catch (err) { toast(UI[lang].eBad); }
};

applyCustom();

/* ================= Start ================= */
shootingStar();
buildStars();
go(mode === "daily" ? dailyState() : randomState());
checkReminders();

/* cloud sync: only loads when firebase-config.js has a config */
if (window.SDB_FIREBASE && location.protocol.startsWith("http")) {
  import("./sync.js").catch(e => console.warn("sync unavailable", e));
}
setInterval(tickClock, 15000);
setInterval(() => paintScene(current()), 10 * 60 * 1000); // sky follows real time
</script>
